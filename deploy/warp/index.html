<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kanzo</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  a { position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<script>
// Warp starfield: one canvas, no libraries, no network calls.
// Light by design: at most 260 stars, 3 stroke calls a frame, 60 fps cap, pixel ratio cap 1.5,
// paused by the browser when the tab is hidden, a still sky under prefers-reduced-motion.
// Served at /warp it continues to the board at "/" after HOLD ms or on any tap or key;
// anywhere else (a preview) it just loops. ?bench prints the average cost of one frame.
(() => {
  const HOLD = 2400, TAIL = 0.14, CRUISE = 0.55, RAMP = 1.8;
  const TIERS = [[0.3, 2.4, 'rgba(255,255,255,1)'], [0.6, 1.7, 'rgba(205,222,255,.9)'], [9, 1.2, 'rgba(175,195,255,.65)']];
  const c = document.getElementById('sky'), g = c.getContext('2d', { alpha: false });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stars = [];
  let w = 0, h = 0, cx = 0, cy = 0, k = 0, d = 1, age = 0, last = 0;

  const spawn = (s, far) => {
    s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1;
    s.z = far ? 1 : 0.1 + Math.random() * 0.9;
    return s;
  };

  function size() {
    d = Math.min(window.devicePixelRatio || 1, 1.5);
    w = c.width = Math.round(innerWidth * d); h = c.height = Math.round(innerHeight * d);
    cx = w / 2; cy = h / 2; k = Math.max(w, h) * 0.6;
    const n = Math.min(260, Math.max(120, Math.round(innerWidth * innerHeight / 6000)));
    while (stars.length < n) stars.push(spawn({}, false));
    stars.length = n;
    if (still) frame(0);
  }

  function frame(dt) {
    age += dt;
    const e = Math.min(age / RAMP, 1), v = still ? 0 : 0.06 + (CRUISE - 0.06) * e * e;
    g.fillStyle = '#02030a'; g.fillRect(0, 0, w, h);
    g.lineCap = 'round';
    for (const s of stars) {
      s.z -= v * dt;
      const x = cx + s.x / s.z * k, y = cy + s.y / s.z * k;
      if (s.z < 0.02 || x < -50 || x > w + 50 || y < -50 || y > h + 50) spawn(s, true);
    }
    let lo = 0;
    for (const [hi, width, color] of TIERS) {
      g.beginPath();
      for (const s of stars) {
        if (s.z < lo || s.z >= hi) continue;
        const x = cx + s.x / s.z * k, y = cy + s.y / s.z * k, t = s.z + v * TAIL + 0.0015;
        g.moveTo(cx + s.x / t * k, cy + s.y / t * k); g.lineTo(x, y);
      }
      g.lineWidth = width * d; g.strokeStyle = color; g.stroke();
      lo = hi;
    }
  }

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = (now - last) / 1000;
    if (dt < 0.012) return;               // 60 fps cap on faster displays
    last = now; frame(Math.min(dt, 0.05));
  }

  addEventListener('resize', size); size();

  if (location.search === '?bench') {
    age = RAMP; const t0 = performance.now();
    for (let i = 0; i < 600; i++) frame(1 / 60);
    const pre = document.body.appendChild(document.createElement('pre'));
    pre.id = 'bench';
    pre.textContent = `stars ${stars.length} canvas ${w}x${h} avg ${((performance.now() - t0) / 600).toFixed(3)} ms per frame`;
    return;
  }
  if (!still) requestAnimationFrame(now => { last = now; requestAnimationFrame(tick); });

  if (location.pathname.replace(/\/$/, '') === '/warp') {
    const go = () => location.replace('/');
    const a = document.body.appendChild(document.createElement('a'));
    a.href = '/'; a.setAttribute('aria-label', 'Open the Kanzo board');
    addEventListener('keydown', go); setTimeout(go, HOLD);
  }
})();
</script>
</body>
</html>
